services:
  app:
    image: ghcr.io/omar-the-junior/salam-hack-2026:main
    pull_policy: always
    restart: unless-stopped
    working_dir: /var/www
    expose:
      - 80
    volumes:
      - storage:/var/www/storage:rw
      - bootstrap-cache:/var/www/bootstrap/cache:rw
    networks:
      - dokploy-network
    env_file:
      - .env

  scheduler:
    image: ghcr.io/omar-the-junior/salam-hack-2026:main
    pull_policy: always
    restart: unless-stopped
    command: php artisan schedule:work
    working_dir: /var/www
    volumes:
      - storage:/var/www/storage:rw
      - bootstrap-cache:/var/www/bootstrap/cache:rw
    networks:
      - dokploy-network
    env_file:
      - .env

volumes:
  storage:
  bootstrap-cache:

networks:
  dokploy-network:
    external: true

# ──────────────────────────────────────────────────────────
# PostgreSQL is managed externally (Dockploy built-in DB or
# a separate service). Set these env vars in Dockploy:
#
#   DB_CONNECTION=pgsql
#   DB_HOST=<postgres-host>
#   DB_PORT=5432
#   DB_DATABASE=mustahaq
#   DB_USERNAME=mustahaq_user
#   DB_PASSWORD=<strong-password>
# ──────────────────────────────────────────────────────────
