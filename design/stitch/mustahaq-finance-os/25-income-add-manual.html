<body class="bg-background text-on-background antialiased min-h-screen flex flex-col items-center justify-center p-pageGutter">
<main class="w-full max-w-xl mx-auto">
<div class="bg-papyrus rounded-xl shadow-md border border-outline-variant p-8 relative overflow-hidden">
<!-- Decorative Header Accent -->
<div class="absolute top-0 left-0 w-full h-2 bg-nileTeal"></div>
<header class="mb-8 flex items-center justify-between">
<div>
<h1 class="font-sectionTitle text-sectionTitle text-mustahaqInk mb-2">إضافة إيراد يدوي</h1>
<p class="font-body text-body text-on-surface-variant">سجل إيراداتك من المصادر المختلفة لتتبع تدفقاتك النقدية.</p>
</div>
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-3xl">add_circle</span>
</div>
</header>
<form class="space-y-gap-form">
<!-- Amount & Date Row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gap-form">
<!-- Amount Field -->
<div class="flex flex-col gap-formFieldGap">
<label class="font-label text-label text-on-surface" for="amount">المبلغ</label>
<div class="relative flex items-center">
<input class="w-full h-controlHeightProminent bg-surface border border-outline-variant rounded-lg pl-24 pr-4 font-financialFigure text-financialFigure text-mustahaqInk focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-shadow shadow-sm" id="amount" name="amount" placeholder="0.00" required="" type="number"/>
<div class="absolute left-2 flex items-center bg-surface-container-low rounded-md border border-outline-variant overflow-hidden h-10">
<select class="bg-transparent border-none text-on-surface font-uiControl text-uiControl focus:ring-0 cursor-pointer pl-2 pr-6 h-full py-0" id="currency" name="currency">
<option value="EGP">EGP</option>
<option value="USD">USD</option>
</select>
</div>
</div>
</div>
<!-- Date Field -->
<div class="flex flex-col gap-formFieldGap">
<label class="font-label text-label text-on-surface" for="date">التاريخ</label>
<div class="relative">
<input class="w-full h-controlHeightProminent bg-surface border border-outline-variant rounded-lg px-4 font-body text-body text-on-surface focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-shadow shadow-sm appearance-none" id="date" name="date" required="" type="date"/>
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">calendar_month</span>
</div>
</div>
</div>
<!-- Source Field -->
<div class="flex flex-col gap-formFieldGap">
<label class="font-label text-label text-on-surface" for="source">مصدر الدخل</label>
<div class="relative">
<select class="w-full h-controlHeightProminent bg-surface border border-outline-variant rounded-lg px-4 pr-10 font-body text-body text-on-surface focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-shadow shadow-sm appearance-none cursor-pointer" id="source" name="source" required="">
<option disabled="" selected="" value="">اختر مصدر الدخل...</option>
<option value="upwork">Upwork</option>
<option value="fiverr">Fiverr</option>
<option value="bank_transfer">تحويل بنكي</option>
<option value="fawry">فوري</option>
<option value="vodafone_cash">Vodafone Cash</option>
<option value="other">أخرى</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Client Name Field -->
<div class="flex flex-col gap-formFieldGap">
<label class="font-label text-label text-on-surface" for="client_name">اسم العميل <span class="text-on-surface-variant font-normal">(اختياري)</span></label>
<input class="w-full h-controlHeightProminent bg-surface border border-outline-variant rounded-lg px-4 font-body text-body text-on-surface focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-shadow shadow-sm" id="client_name" name="client_name" placeholder="أدخل اسم العميل أو الشركة" type="text"/>
</div>
<!-- Category Field -->
<div class="flex flex-col gap-formFieldGap">
<label class="font-label text-label text-on-surface">التصنيف</label>
<div class="grid grid-cols-2 md:grid-cols-3 gap-3">
<label class="relative flex items-center justify-center p-3 border border-outline-variant rounded-lg cursor-pointer bg-surface hover:bg-surface-container-low transition-colors has-[:checked]:bg-primary-container has-[:checked]:border-primary has-[:checked]:text-on-primary-container">
<input class="sr-only" name="category" type="radio" value="freelance"/>
<span class="font-uiControl text-uiControl">عمل حر</span>
</label>
<label class="relative flex items-center justify-center p-3 border border-outline-variant rounded-lg cursor-pointer bg-surface hover:bg-surface-container-low transition-colors has-[:checked]:bg-primary-container has-[:checked]:border-primary has-[:checked]:text-on-primary-container">
<input class="sr-only" name="category" type="radio" value="product_sale"/>
<span class="font-uiControl text-uiControl">بيع منتج</span>
</label>
<label class="relative flex items-center justify-center p-3 border border-outline-variant rounded-lg cursor-pointer bg-surface hover:bg-surface-container-low transition-colors has-[:checked]:bg-primary-container has-[:checked]:border-primary has-[:checked]:text-on-primary-container">
<input class="sr-only" name="category" type="radio" value="consulting"/>
<span class="font-uiControl text-uiControl">استشارات</span>
</label>
<label class="relative flex items-center justify-center p-3 border border-outline-variant rounded-lg cursor-pointer bg-surface hover:bg-surface-container-low transition-colors has-[:checked]:bg-primary-container has-[:checked]:border-primary has-[:checked]:text-on-primary-container">
<input class="sr-only" name="category" type="radio" value="content_creation"/>
<span class="font-uiControl text-uiControl">صناعة محتوى</span>
</label>
<label class="relative flex items-center justify-center p-3 border border-outline-variant rounded-lg cursor-pointer bg-surface hover:bg-surface-container-low transition-colors has-[:checked]:bg-primary-container has-[:checked]:border-primary has-[:checked]:text-on-primary-container md:col-span-2">
<input class="sr-only" name="category" type="radio" value="other"/>
<span class="font-uiControl text-uiControl">أخرى</span>
</label>
</div>
</div>
<!-- Notes Field -->
<div class="flex flex-col gap-formFieldGap">
<label class="font-label text-label text-on-surface" for="notes">ملاحظات <span class="text-on-surface-variant font-normal">(اختياري)</span></label>
<textarea class="w-full bg-surface border border-outline-variant rounded-lg p-4 font-body text-body text-on-surface focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-shadow shadow-sm resize-none" id="notes" name="notes" placeholder="أضف أي تفاصيل أخرى هنا..." rows="3"></textarea>
</div>
<!-- Actions -->
<div class="flex flex-col md:flex-row-reverse gap-4 pt-4 border-t border-outline-variant/30 mt-6">
<button class="flex-1 h-controlHeightProminent bg-nileTeal text-on-primary font-uiControl text-uiControl rounded-lg shadow-sm hover:bg-nileTealDeep transition-colors flex items-center justify-center gap-2" type="submit">
<span class="material-symbols-outlined text-[20px]">save</span>
                        حفظ الإيراد
                    </button>
<button class="w-full md:w-auto px-8 h-controlHeightProminent bg-transparent border-2 border-sand text-on-surface font-uiControl text-uiControl rounded-lg hover:bg-surface-container-low transition-colors flex items-center justify-center" type="button">
                        إلغاء
                    </button>
</div>
</form>
</div>
</main>
</body></html>
