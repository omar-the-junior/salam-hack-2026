<!-- Header -->
<header class="text-center flex flex-col gap-2">
<h1 class="font-marketingWordmark text-marketingWordmark text-primary-container tracking-tight">مُسْتَحَقّ</h1>
<p class="font-bodyLarge text-bodyLarge text-on-surface-variant">ابدأ رحلتك المالية الاحترافية</p>
</header>
<!-- Form -->
<form action="#" class="flex flex-col gap-formSectionGap" method="POST">
<!-- Full Name -->
<div class="flex flex-col gap-formFieldGap">
<label class="font-label text-label text-on-surface" for="fullName">الاسم الكامل</label>
<div class="relative">
<span class="absolute right-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant pointer-events-none">person</span>
<input class="w-full h-controlHeightLarge rounded-lg border border-outline-variant bg-transparent pr-10 pl-3 py-2 font-uiControl text-uiControl text-on-surface focus:outline-none focus:ring-2 focus:ring-ring/50 focus:border-ring placeholder:text-on-surface-variant/50 transition-shadow shadow-[inset_0_1px_2px_rgba(0,0,0,0.02)]" id="fullName" name="fullName" placeholder="أحمد محمد" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-formFieldGap">
<label class="font-label text-label text-on-surface" for="email">البريد الإلكتروني</label>
<div class="relative">
<span class="absolute right-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant pointer-events-none">mail</span>
<input class="w-full h-controlHeightLarge rounded-lg border border-outline-variant bg-transparent pr-10 pl-3 py-2 font-uiControl text-uiControl text-on-surface focus:outline-none focus:ring-2 focus:ring-ring/50 focus:border-ring placeholder:text-on-surface-variant/50 transition-shadow shadow-[inset_0_1px_2px_rgba(0,0,0,0.02)] text-left dir-ltr" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-formFieldGap">
<label class="font-label text-label text-on-surface" for="password">كلمة المرور</label>
<div class="relative">
<span class="absolute right-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant pointer-events-none">lock</span>
<input class="w-full h-controlHeightLarge rounded-lg border border-outline-variant bg-transparent pr-10 pl-3 py-2 font-uiControl text-uiControl text-on-surface focus:outline-none focus:ring-2 focus:ring-ring/50 focus:border-ring placeholder:text-on-surface-variant/50 transition-shadow shadow-[inset_0_1px_2px_rgba(0,0,0,0.02)] text-left dir-ltr" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Confirm Password -->
<div class="flex flex-col gap-formFieldGap">
<label class="font-label text-label text-on-surface" for="confirmPassword">تأكيد كلمة المرور</label>
<div class="relative">
<span class="absolute right-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant pointer-events-none">lock_reset</span>
<input class="w-full h-controlHeightLarge rounded-lg border border-outline-variant bg-transparent pr-10 pl-3 py-2 font-uiControl text-uiControl text-on-surface focus:outline-none focus:ring-2 focus:ring-ring/50 focus:border-ring placeholder:text-on-surface-variant/50 transition-shadow shadow-[inset_0_1px_2px_rgba(0,0,0,0.02)] text-left dir-ltr" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" type="password"/>
</div>
</div>

<button class="mt-2 w-full h-controlHeightProminent rounded-lg bg-primary-container text-on-primary-container font-uiControl text-uiControl flex items-center justify-center gap-2 shadow-sm hover:bg-tertiary-container transition-colors focus:outline-none focus:ring-2 focus:ring-ring/50 focus:ring-offset-2 focus:ring-offset-surface-container-lowest" type="submit">
                إنشاء حساب
            </button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 px-2">
<div class="flex-1 h-px bg-surface-variant"></div>
<span class="font-caption text-caption text-on-surface-variant">أو</span>
<div class="flex-1 h-px bg-surface-variant"></div>
</div>

<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>

            </button>
<button class="w-full h-controlHeightLarge rounded-lg border border-outline-variant bg-transparent flex items-center justify-center gap-3 hover:bg-surface-container-low transition-colors font-uiControl text-uiControl text-on-surface focus:outline-none focus:ring-2 focus:ring-ring/50" type="button">
<svg fill="none" height="18" viewbox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M22.5 0H1.5C0.671 0 0 0.65 0 1.45V22.55C0 23.35 0.671 24 1.5 24H22.5C23.329 24 24 23.35 24 22.55V1.45C24 0.65 23.329 0 22.5 0ZM7.12 20.452H3.558V9H7.12V20.452ZM5.337 7.433C4.195 7.433 3.268 6.505 3.268 5.362C3.268 4.22 4.195 3.292 5.337 3.292C6.479 3.292 7.406 4.22 7.406 5.362C7.406 6.505 6.479 7.433 5.337 7.433ZM20.452 20.452H16.89V14.881C16.89 13.554 16.866 11.848 15.044 11.848C13.197 11.848 12.914 13.288 12.914 14.786V20.452H9.351V9H12.772V10.563H12.82C13.296 9.663 14.457 8.718 16.182 8.718C19.778 8.718 20.452 11.082 20.452 14.168V20.452Z" fill="#0A66C2" fill-rule="evenodd"></path>

<p class="font-caption text-caption text-on-surface-variant text-center max-w-[16rem] leading-relaxed">

                <a class="underline hover:text-on-surface transition-colors focus:outline-none focus:ring-1 focus:ring-ring/50 rounded" href="#">الشروط والأحكام</a>
