<div class="mb-8 text-center w-full flex flex-col items-center gap-4">
<h1 class="font-marketingWordmark text-marketingWordmark text-primary-container tracking-tight">مُسْتَحَقّ</h1>
<h2 class="font-featureTitle text-featureTitle text-on-surface">ابدأ رحلتك المالية الاحترافية</h2>
<p class="font-bodySmall text-bodySmall text-on-surface-variant max-w-[280px]">

            </p>

<input class="w-full h-controlHeightProminent bg-surface-container-low border border-outline-variant/50 rounded-lg pr-10 pl-3 font-ui-control text-ui-control text-on-surface focus:outline-none focus:ring-2 focus:ring-ring focus:border-transparent transition-shadow placeholder:text-on-surface-variant/40" id="name" placeholder="أحمد محمد" type="text"/>
</div>
</div>
<div class="flex flex-col gap-formFieldGap">
<label class="font-label text-label text-on-surface" for="email">البريد الإلكتروني</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute right-3 text-on-surface-variant/50" style="font-variation-settings: 'FILL' 0;">mail</span>

</div>
</div>

<label class="font-label text-label text-on-surface" for="password">كلمة المرور</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute right-3 text-on-surface-variant/50" style="font-variation-settings: 'FILL' 0;">lock</span>

<button class="absolute left-3 text-on-surface-variant/50 hover:text-on-surface transition-colors flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
</div>
</div>
<div class="flex flex-col gap-formFieldGap">
<label class="font-label text-label text-on-surface" for="confirm-password">تأكيد كلمة المرور</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute right-3 text-on-surface-variant/50" style="font-variation-settings: 'FILL' 0;">lock_reset</span>

</button>
