<body class="bg-surface min-h-screen flex flex-col items-center justify-center p-pageGutter relative selection:bg-primary-container selection:text-on-primary-container">
<!-- Brand Wordmark -->
<div class="absolute top-8 left-0 right-0 flex justify-center w-full px-pageGutter">
<span class="font-marketingWordmark text-marketingWordmark text-primary font-bold tracking-tight">مُسْتَحَقّ</span>
</div>
<!-- Main Content Canvas -->
<main class="w-full max-w-[48rem] flex flex-col items-center mt-16 md:mt-0">
<!-- Question -->
<h1 class="font-sectionTitle text-sectionTitle text-on-surface mb-12 text-center">
            كيف ستستخدم مُسْتَحَقّ؟
        </h1>
<!-- Selection Cards Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gap-standard w-full mb-12">
<!-- Card 1: Freelancer -->
<label class="group relative bg-surface-container-lowest border border-outline-variant rounded-xl p-cardPaddingY px-cardPaddingX cursor-pointer hover:shadow-sm hover:border-primary hover:bg-surface-bright transition-all duration-200 flex flex-col items-start text-right focus-within:ring-2 focus-within:ring-ring focus-within:ring-opacity-50">
<input class="absolute opacity-0 w-0 h-0 peer" name="user_type" type="radio" value="freelancer"/>
<!-- Active State Indicator (Border) -->
<div class="absolute inset-0 rounded-xl border-2 border-transparent peer-checked:border-primary peer-checked:bg-primary/5 pointer-events-none transition-colors"></div>
<!-- Icon -->
<div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center mb-6 group-hover:bg-primary-container/10 peer-checked:bg-primary-container/10 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary peer-checked:text-primary" style="font-variation-settings: 'FILL' 0;">person</span>
</div>
<!-- Text -->
<h2 class="font-cardTitle text-cardTitle text-on-surface mb-2 relative z-10">مستقل</h2>
<p class="font-body text-body text-on-surface-variant relative z-10">أعمل بشكل مستقل مع العملاء</p>
<!-- Checkmark Indicator (Visible when selected) -->
<div class="absolute top-cardPaddingY left-cardPaddingX opacity-0 peer-checked:opacity-100 transition-opacity text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</label>
<!-- Card 2: Small Business Owner -->
<label class="group relative bg-surface-container-lowest border border-outline-variant rounded-xl p-cardPaddingY px-cardPaddingX cursor-pointer hover:shadow-sm hover:border-primary hover:bg-surface-bright transition-all duration-200 flex flex-col items-start text-right focus-within:ring-2 focus-within:ring-ring focus-within:ring-opacity-50">
<input class="absolute opacity-0 w-0 h-0 peer" name="user_type" type="radio" value="business"/>
<!-- Active State Indicator (Border) -->
<div class="absolute inset-0 rounded-xl border-2 border-transparent peer-checked:border-primary peer-checked:bg-primary/5 pointer-events-none transition-colors"></div>
<!-- Icon -->
<div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center mb-6 group-hover:bg-primary-container/10 peer-checked:bg-primary-container/10 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary peer-checked:text-primary" style="font-variation-settings: 'FILL' 0;">storefront</span>
</div>
<!-- Text -->
<h2 class="font-cardTitle text-cardTitle text-on-surface mb-2 relative z-10">صاحب عمل</h2>
<p class="font-body text-body text-on-surface-variant relative z-10">أدير عملاً أو وكالة</p>
<!-- Checkmark Indicator (Visible when selected) -->
<div class="absolute top-cardPaddingY left-cardPaddingX opacity-0 peer-checked:opacity-100 transition-opacity text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</label>
</div>

<button class="w-full md:w-[240px] h-controlHeightProminent bg-primary text-on-primary font-uiControl text-uiControl rounded-DEFAULT shadow-sm flex items-center justify-center hover:opacity-90 active:scale-[0.98] transition-all focus:outline-none focus:ring-2 focus:ring-ring focus:ring-opacity-50 focus:ring-offset-2 focus:ring-offset-surface" type="button">

        </button>
