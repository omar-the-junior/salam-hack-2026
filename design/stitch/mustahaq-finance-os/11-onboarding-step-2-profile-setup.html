<style>
        .marketing-bg-pattern {
            background-image: radial-gradient(var(--tw-colors-marketing-grid) 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface antialiased min-h-screen flex flex-col items-center justify-center p-pageGutter marketing-bg-pattern">
<!-- Header / Logo -->
<header class="absolute top-0 w-full flex justify-center py-pageGutterWide">
<h1 class="font-marketingWordmark text-marketingWordmark text-primary tracking-tight">مُسْتَحَقّ</h1>
</header>
<!-- Main Content Container -->
<main class="w-full max-w-containerMaxWidthNarrow bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant p-cardPaddingY md:p-marketingCardPadding mt-marketingSectionY">
<!-- Step Indicator -->
<div class="mb-gap-standard flex items-center justify-center space-x-2 space-x-reverse">
<div class="w-8 h-1 rounded-full bg-primary"></div>
<div class="w-8 h-1 rounded-full bg-primary"></div>
<div class="w-8 h-1 rounded-full bg-surface-variant"></div>
</div>
<div class="text-center mb-section-marketing md:mb-8">
<h2 class="font-sectionTitle text-sectionTitle text-on-surface mb-unit">إعداد ملفك الشخصي</h2>
<p class="font-body text-body text-on-surface-variant">خطوتك الأخيرة للبدء في إدارة أعمالك باحترافية.</p>
</div>
<form class="space-y-formSectionGap">
<!-- Display Name -->
<div class="space-y-formFieldGap">
<label class="font-label text-label text-on-surface block" for="display-name">اسم العرض</label>
<div class="relative">
<input class="w-full h-controlHeightProminent px-4 rounded-DEFAULT border border-outline-variant bg-transparent text-on-surface focus:ring-2 focus:ring-primary/50 focus:border-primary transition-shadow placeholder-on-surface-variant/50" id="display-name" placeholder="ما هو الاسم الذي سيراه العملاء؟" type="text"/>
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="badge">badge</span>
</div>
</div>
<!-- Country & Currency Row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gap-standard">
<!-- Country Dropdown -->
<div class="space-y-formFieldGap">
<label class="font-label text-label text-on-surface block" for="country">الدولة</label>
<div class="relative">
<select class="w-full h-controlHeightProminent px-4 appearance-none rounded-DEFAULT border border-outline-variant bg-transparent text-on-surface focus:ring-2 focus:ring-primary/50 focus:border-primary transition-shadow" id="country">
<option disabled="" selected="" value="">اختر الدولة</option>
<option value="eg">مصر</option>
<option value="sa">السعودية</option>
<option value="ae">الإمارات</option>
<option value="other">أخرى</option>
</select>
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Currency -->
<div class="space-y-formFieldGap">
<label class="font-label text-label text-on-surface block" for="currency">العملة المفضلة</label>
<div class="relative">
<select class="w-full h-controlHeightProminent px-4 appearance-none rounded-DEFAULT border border-outline-variant bg-transparent text-on-surface focus:ring-2 focus:ring-primary/50 focus:border-primary transition-shadow" id="currency">
<option value="egp">جنيه مصري (EGP)</option>
<option value="usd">دولار أمريكي (USD)</option>
<option value="sar">ريال سعودي (SAR)</option>
<option value="aed">درهم إماراتي (AED)</option>
</select>
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none" data-icon="payments">payments</span>
</div>
</div>
</div>
<!-- Profession Chips -->
<div class="space-y-formFieldGap pt-unit">
<label class="font-label text-label text-on-surface block">المهنة</label>
<div class="flex flex-wrap gap-2">
<label class="cursor-pointer">
<input class="peer sr-only" name="profession" type="radio" value="developer"/>
<div class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant peer-checked:bg-primary peer-checked:text-on-primary peer-checked:border-primary hover:bg-surface-variant transition-colors font-uiControl text-uiControl">مطور</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="profession" type="radio" value="designer"/>
<div class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant peer-checked:bg-primary peer-checked:text-on-primary peer-checked:border-primary hover:bg-surface-variant transition-colors font-uiControl text-uiControl">مصمم</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="profession" type="radio" value="marketer"/>
<div class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant peer-checked:bg-primary peer-checked:text-on-primary peer-checked:border-primary hover:bg-surface-variant transition-colors font-uiControl text-uiControl">مسوق</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="profession" type="radio" value="consultant"/>
<div class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant peer-checked:bg-primary peer-checked:text-on-primary peer-checked:border-primary hover:bg-surface-variant transition-colors font-uiControl text-uiControl">مستشار</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="profession" type="radio" value="creator"/>
<div class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant peer-checked:bg-primary peer-checked:text-on-primary peer-checked:border-primary hover:bg-surface-variant transition-colors font-uiControl text-uiControl">صانع محتوى</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="profession" type="radio" value="other"/>
<div class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant peer-checked:bg-primary peer-checked:text-on-primary peer-checked:border-primary hover:bg-surface-variant transition-colors font-uiControl text-uiControl">آخر</div>
</label>
</div>
</div>
<!-- Submit Action -->
<div class="pt-formSectionGap">
<button class="w-full h-controlHeightProminent bg-primary text-on-primary font-uiControl text-uiControl rounded-DEFAULT shadow-sm hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
<span>ابدأ الآن</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
</main>
</body></html>
