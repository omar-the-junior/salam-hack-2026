<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-pageGutter antialiased text-on-surface font-body selection:bg-primary-fixed selection:text-on-primary-fixed">

<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-inverse-primary opacity-50"></div>
<div class="text-center mb-8">
<h1 class="font-marketingWordmark text-marketingWordmark text-primary mb-6">مُسْتَحَقّ</h1>
<h2 class="font-cardTitle text-cardTitle text-on-surface mb-2">إعادة ضبط كلمة المرور</h2>
<p class="font-bodySmall text-bodySmall text-on-surface-variant">قم بإنشاء كلمة مرور جديدة وقوية لحسابك.</p>
</div>
<form class="space-y-formSectionGap">
<div class="space-y-formFieldGap">
<label class="font-label text-label text-on-surface block" for="email">البريد الإلكتروني</label>
<div class="relative">
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg">mail</span>
<input class="w-full h-controlHeightProminent pl-3 pr-10 border border-outline-variant rounded-lg bg-surface-container-high text-on-surface-variant font-body cursor-not-allowed focus:outline-none" disabled="" id="email" readonly="" type="email" value="ahmed.mohamed@example.com"/>
</div>
</div>
<div class="space-y-formFieldGap">
<label class="font-label text-label text-on-surface block" for="new-password">كلمة المرور الجديدة</label>
<div class="relative">
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg">lock</span>
<input class="w-full h-controlHeightProminent pl-10 pr-10 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body focus:ring-2 focus:ring-ring focus:border-ring focus:outline-none transition-shadow placeholder:text-on-surface-variant/50" id="new-password" placeholder="أدخل كلمة المرور الجديدة" type="password"/>
<button class="absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors flex items-center justify-center h-full focus:outline-none focus:text-primary" type="button">
<span class="material-symbols-outlined text-xl">visibility_off</span>
</button>
</div>
<div class="mt-3 space-y-1.5 p-3 rounded-lg bg-surface-container border border-surface-variant">
<p class="font-caption text-caption text-on-surface-variant mb-2">يجب أن تحتوي كلمة المرور على:</p>
<ul class="space-y-1.5">
<li class="flex items-center gap-2 font-caption text-caption text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-outline">check_circle</span>
<span>8 أحرف على الأقل</span>
</li>
<li class="flex items-center gap-2 font-caption text-caption text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-outline">check_circle</span>
<span>رقم واحد على الأقل</span>
</li>
<li class="flex items-center gap-2 font-caption text-caption text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-outline">check_circle</span>
<span>رمز خاص واحد على الأقل (!@#$%)</span>
</li>
</ul>
</div>
</div>
<div class="space-y-formFieldGap">
<label class="font-label text-label text-on-surface block" for="confirm-password">تأكيد كلمة المرور الجديدة</label>
<div class="relative">
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg">lock_reset</span>
<input class="w-full h-controlHeightProminent pl-10 pr-10 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body focus:ring-2 focus:ring-ring focus:border-ring focus:outline-none transition-shadow placeholder:text-on-surface-variant/50" id="confirm-password" placeholder="أعد إدخال كلمة المرور" type="password"/>
<button class="absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors flex items-center justify-center h-full focus:outline-none focus:text-primary" type="button">
<span class="material-symbols-outlined text-xl">visibility_off</span>
</button>
</div>
</div>
<div class="pt-4">
<button class="w-full h-controlHeightProminent flex items-center justify-center bg-primary text-on-primary rounded-lg font-uiControl text-uiControl shadow-sm hover:bg-on-surface hover:text-surface-container-lowest transition-all active:scale-[0.98]" type="submit">
                    تحديث كلمة المرور
                </button>
</div>
<div class="text-center pt-2">
<a class="inline-flex items-center gap-1 font-uiControl text-uiControl text-secondary hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-sm">arrow_forward</span>
                    العودة إلى تسجيل الدخول
                </a>
</div>
